name: Probe Instagram
on:
  push:
    branches: [probe2]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 probe.py DeyQf_PzHlD
      - name: Publish report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete probe-report --yes --cleanup-tag || true
          gh release create probe-report probe-report.txt --prerelease --target probe2 --title "probe" --notes "temporary"
