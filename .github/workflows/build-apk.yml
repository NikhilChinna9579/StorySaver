name: Build APK

# Builds the app on GitHub's servers and publishes StorySaver.apk as a direct download
# on the repository's "Releases" page (tag: latest). Runs on every push, or manually.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk StorySaver.apk

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StorySaver.apk \
            --title "Story Saver (latest build)" \
            --notes "Download StorySaver.apk and open it on an Android phone to install. Built from ${GITHUB_SHA::7}."

      - name: Also keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: StorySaver-apk
          path: StorySaver.apk
