name: Build APK

# build: compiles, runs unit tests, runs a live Instagram check, publishes StorySaver.apk to the
#        "latest" release (a direct download link).
# e2e:   runs the app on an Android emulator (real Instagram link, fake WhatsApp folder, system
#        folder picker) and publishes screenshots + a report to the "test-report" release.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        run: bash .github/setup-sdk.sh
      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk StorySaver.apk

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Live Instagram check (real network)
        continue-on-error: true
        env:
          LIVE_INSTAGRAM: "1"
        run: |
          ./gradlew testDebugUnitTest --tests '*InstagramLiveTest*' --rerun-tasks -q || status=$?
          if [ -f app/build/live-instagram.txt ]; then
            while IFS= read -r line; do echo "::notice title=live-instagram::$line"; done < app/build/live-instagram.txt
          else
            echo "::notice title=live-instagram::no report written"
          fi
          exit ${status:-0}

      - name: Live YouTube check (real network)
        continue-on-error: true
        env:
          LIVE_YOUTUBE: "1"
        run: |
          ./gradlew testDebugUnitTest --tests '*YouTubeLiveTest*' --rerun-tasks -q || status=$?
          if [ -f app/build/live-youtube.txt ]; then
            while IFS= read -r line; do echo "::notice title=live-youtube::$line"; done < app/build/live-youtube.txt
          else
            echo "::notice title=live-youtube::no report written"
          fi
          exit ${status:-0}

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete probe-report --yes --cleanup-tag || true   # leftover from investigation
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest StorySaver.apk \
            --title "Story Saver (latest build)" \
            --notes "Download StorySaver.apk and open it on an Android phone to install. Built from ${GITHUB_SHA::7}."

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        run: bash .github/setup-sdk.sh
      - uses: gradle/actions/setup-gradle@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Make test media (fake WhatsApp statuses)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p fixtures
          for i in 1 2 3; do
            ffmpeg -loglevel error -f lavfi -i "testsrc=size=480x854:rate=1" -frames:v 1 -y fixtures/img$i.jpg
          done
          for i in 1 2 3 4; do
            ffmpeg -loglevel error -f lavfi -i "testsrc=duration=2:size=480x854:rate=15" -pix_fmt yuv420p -y fixtures/vid$i.mp4
          done
          # YouTube-style split streams (fragmented MP4, H.264 video-only + AAC audio-only) for the merge test
          FRAG="+frag_keyframe+empty_moov+default_base_moof"
          ffmpeg -loglevel error -f lavfi -i "testsrc=duration=6:size=640x360:rate=30" -c:v libx264 -pix_fmt yuv420p -an -movflags $FRAG -y fixtures/yt-video.mp4
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=6" -c:a aac -b:a 128k -vn -movflags $FRAG -y fixtures/yt-audio.m4a
          ls -la fixtures

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/e2e.sh

      - name: Publish test report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          mkdir -p e2e-out
          # GitHub shows at most 10 notices per step: keep them to per-class results + first errors.
          [ -f e2e-out/instrument.txt ] && grep -E "^(=== |OK \(|Tests run|[0-9]+\) )|AssertionError|Exception:" e2e-out/instrument.txt \
            | grep -v "^\s*at " | head -9 | paste -sd ' ' | sed 's/^/::notice title=e2e::/'
          [ -f e2e-out/files.txt ] && grep -o "StorySaver_[A-Z]*_[^ ]*" e2e-out/files.txt | paste -sd ' ' | sed 's/^/::notice title=e2e-files::/'
          cd e2e-out && zip -qr ../e2e-report.zip . && cd ..
          gh release delete test-report --yes --cleanup-tag || true
          sleep 8
          for i in 1 2 3; do
            if gh release create test-report e2e-report.zip e2e-out/*.png e2e-out/*.txt --prerelease \
                 --title "Emulator test report" --notes "Screenshots and logs from the emulator test run of ${GITHUB_SHA::7}."; then
              break
            fi
            sleep 10
          done
